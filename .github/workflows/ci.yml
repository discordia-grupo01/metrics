name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: "1.22"
      - name: Chequeo de formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Archivos sin formatear:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Build Go
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Validar openapi.yaml
        run: make openapi
      - name: Go test
        run: go test ./... -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Verificar cobertura minima (70%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 70)}"; then
            echo "::error::Cobertura ${COVERAGE}% por debajo del minimo requerido (70%)"
            exit 1
          fi
      - name: Build de imagen Docker
        run: docker build -t discordia-metrics:ci .
      - name: Validar configuración de Docker Compose
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=test
          HOST=0.0.0.0
          PORT=8080
          DATABASE_HOST=db
          DATABASE_PORT=5432
          DATABASE_NAME=discordia_metrics
          DATABASE_USER=discordia
          DATABASE_PASSWORD=discordia
          DATABASE_SSLMODE=disable
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
          EVENTS_EXCHANGE=discordia.events
          EVENTS_QUEUE=metrics
          STAFF_USER_IDS=
          EOF
          docker compose config
      - name: Smoke test del despliegue
        run: |
          set -e
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose up -d --build
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/livez; then
              echo
              curl --fail --silent http://localhost:8080/readyz
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api migrations
          exit 1
      - name: Limpiar configuración de CI
        if: always()
        run: rm -f .env