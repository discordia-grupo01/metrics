openapi: 3.0.0
info:
  contact: {}
  description: >-
    API de métricas de actividad y estado de plataforma de Discordia.


    El servicio mantiene una proyección local de eventos publicados en RabbitMQ; no accede directamente a las bases de datos de otros servicios. Kong valida el JWT en el gateway: las rutas `/v1/**` requieren `Authorization: Bearer <JWT>`; el servicio solo lee el `sub` del token (o un header de usuario configurable) sin verificar la firma.


    Las métricas de servidor, las métricas globales, la salud de los servicios y la gestión de incidentes requieren un usuario de staff según la proyección local sincronizada desde admin. `GET /v1/status` solo exige estar autenticado.


    Todos los errores (status 4xx y 5xx de las rutas `/v1/**`, incluidos 404 de ruta inexistente y 405) tienen la forma `{"error": {"code", "message", "details"}}`. `code` es un texto estable en SCREAMING_SNAKE_CASE, `message` es legible y `details` es siempre un objeto. `/livez` y `/readyz` conservan su formato `{"status": ...}`.
  title: Discordia - Metrics
  version: 1.0.0
paths:
  /livez:
    get:
      description: Confirma que el proceso está vivo. No consulta dependencias;
        responde 200 sin cuerpo.
      responses:
        "200":
          description: El proceso está vivo
      summary: Liveness check
      tags:
        - Health
  /readyz:
    get:
      description: Verifica que el servicio puede conectarse a PostgreSQL.
      responses:
        "200":
          description: Listo para recibir tráfico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.StatusResponse"
        "503":
          description: PostgreSQL no responde (status not_ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.StatusResponse"
      summary: Readiness check
      tags:
        - Health
  /v1/health/services:
    get:
      description: Requiere staff. Devuelve el último estado observado por el monitor
        de metrics.
      responses:
        "200":
          description: Estados observados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handler.ServiceHealthResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Consultar el estado de salud de los servicios
      tags:
        - Incidents
  /v1/metrics/global:
    get:
      description: "Agrega la actividad de todos los servidores. Requiere que el
        usuario autenticado esté en la proyección local de staff sincronizada
        desde admin. Además de los totales devuelve una serie para graficar: los
        períodos de hasta 24 horas se dividen por hora y los más largos por día.
        Los tramos empiezan en `from`, así que si el cliente manda la medianoche
        local los días coinciden con su zona horaria. El último tramo se recorta
        en `to`."
      parameters:
        - description: Inicio inclusivo del período en RFC3339 (por defecto, 30 días antes
            de `to`)
          in: query
          name: from
          schema:
            type: string
            format: date-time
        - description: Fin exclusivo del período en RFC3339 (por defecto, ahora); el
            período máximo es de 366 días
          in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Resumen global
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.GlobalSummary"
        "400":
          description: Período inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Consultar métricas globales de la plataforma
      tags:
        - Platform metrics
  /v1/metrics/incidents:
    get:
      description: Requiere staff. Devuelve los incidentes resueltos del más nuevo al
        más viejo, paginados. `created_by` y `resolved_by` son los ids del staff
        que lo publicó y lo resolvió; faltan en los incidentes anteriores a
        guardar ese dato.
      parameters:
        - description: Busca en el título y la descripción (hasta 100 caracteres)
          in: query
          name: search
          schema:
            type: string
            maxLength: 100
        - description: Tipo de incidente
          in: query
          name: type
          schema:
            type: string
            enum:
              - degraded
              - maintenance
        - description: Id de un servicio afectado
          in: query
          name: service
          schema:
            type: string
        - description: Solo incidentes creados desde esta fecha (RFC3339)
          in: query
          name: from
          schema:
            type: string
            format: date-time
        - description: Tamaño de página
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - description: Cantidad de incidentes a saltear
          in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Página del historial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.IncidentPage"
        "400":
          description: Algún parámetro de la query es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Listar el historial de incidentes resueltos
      tags:
        - Incidents
    post:
      description: Requiere que el usuario autenticado sea staff. Si no se envía
        `platform_status`, se usa `degraded`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.IncidentInput"
        description: Datos del incidente
        required: true
      responses:
        "201":
          description: Incidente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.Incident"
        "400":
          description: Cuerpo inválido o fuera de los límites de largo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Publicar un incidente
      tags:
        - Incidents
  "/v1/metrics/incidents/{id}/resolve":
    post:
      description: Requiere staff y un incidente actualmente activo.
      parameters:
        - description: UUID del incidente
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Incidente resuelto
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "404":
          description: El incidente no existe o ya estaba resuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Resolver un incidente
      tags:
        - Incidents
  "/v1/servers/{serverId}/metrics":
    get:
      description: Devuelve miembros activos, mensajes enviados y nuevos miembros
        dentro del período solicitado. Requiere rol de staff. Si no hubo
        actividad, responde 200 con contadores en cero y has_activity=false.
      parameters:
        - description: UUID del servidor
          in: path
          name: serverId
          required: true
          schema:
            type: string
            format: uuid
        - description: Inicio inclusivo del período en RFC3339 (por defecto, 30 días antes
            de `to`)
          in: query
          name: from
          schema:
            type: string
            format: date-time
        - description: Fin exclusivo del período en RFC3339 (por defecto, ahora); el
            período máximo es de 366 días
          in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Resumen de actividad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ServerSummary"
        "400":
          description: Servidor o período inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Consultar el resumen de actividad de un servidor
      tags:
        - Server metrics
  "/v1/servers/{serverId}/metrics/export.csv":
    get:
      description: Genera un archivo CSV con el resumen del período. Requiere rol de staff.
      parameters:
        - description: UUID del servidor
          in: path
          name: serverId
          required: true
          schema:
            type: string
            format: uuid
        - description: Inicio inclusivo del período en RFC3339 (por defecto, 30 días antes
            de `to`)
          in: query
          name: from
          schema:
            type: string
            format: date-time
        - description: Fin exclusivo del período en RFC3339 (por defecto, ahora); el
            período máximo es de 366 días
          in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Archivo CSV generado (text/csv); los errores responden JSON
          headers:
            Content-Disposition:
              description: Nombre sugerido del archivo, attachment; filename=metrics.csv
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Servidor o período inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
            text/csv:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
            text/csv:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
            text/csv:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
            text/csv:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Exportar métricas de un servidor a CSV
      tags:
        - Server metrics
  "/v1/servers/{serverId}/metrics/growth":
    get:
      description: Devuelve un punto por cada tramo de 24 h desde `from` (el último
        termina en `to`), con la cantidad de miembros al cierre del tramo. Los
        tramos sin cambios se incluyen con el total. Requiere rol de staff.
      parameters:
        - description: UUID del servidor
          in: path
          name: serverId
          required: true
          schema:
            type: string
            format: uuid
        - description: Inicio inclusivo del período en RFC3339 (por defecto, 30 días antes
            de `to`)
          in: query
          name: from
          schema:
            type: string
            format: date-time
        - description: Fin exclusivo del período en RFC3339 (por defecto, ahora); el
            período máximo es de 366 días
          in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Serie diaria de miembros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.GrowthResponse"
        "400":
          description: Servidor o período inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "403":
          description: El usuario no tiene rol de staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Consultar el crecimiento diario de miembros
      tags:
        - Server metrics
  /v1/status:
    get:
      description: Devuelve el estado actual y los incidentes activos para cualquier
        usuario autenticado.
      responses:
        "200":
          description: Estado e incidentes activos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.PlatformStatusResponse"
        "401":
          description: Falta una credencial válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ErrorResponse"
      security:
        - BearerAuth: []
      summary: Consultar el estado actual de la plataforma
      tags:
        - Incidents
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    BearerAuth:
      description: Escribir "Bearer " seguido del JWT.
      in: header
      name: Authorization
      type: apiKey
  schemas:
    apierr.Body:
      properties:
        code:
          example: FORBIDDEN
          type: string
        details:
          additionalProperties: {}
          type: object
        message:
          example: No tenés permisos de staff para realizar esta acción.
          type: string
      required:
        - code
        - details
        - message
      type: object
    handler.ServiceHealthResponse:
      properties:
        services:
          items:
            $ref: "#/components/schemas/health.ServiceStatus"
          type: array
      required:
        - services
      type: object
    health.ServiceStatus:
      properties:
        consecutive_failures:
          minimum: 0
          type: integer
        last_checked_at:
          format: date-time
          type: string
        name:
          type: string
        status:
          enum:
            - unknown
            - operational
            - degraded
          type: string
      required:
        - last_checked_at
        - name
        - status
      type: object
    model.ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/apierr.Body"
      required:
        - error
      type: object
    model.GlobalPoint:
      properties:
        active_users:
          description: >-
            ActiveUsers cuenta usuarios distintos dentro del tramo, con el mismo
            criterio

            que el total del período. No sumar los tramos para obtener el total: quien

            estuvo activo varios días aparece en cada uno, pero en el total cuenta una vez.
          minimum: 0
          type: integer
        messages_sent:
          minimum: 0
          type: integer
        servers_created:
          minimum: 0
          type: integer
        start:
          description: Start es el inicio del tramo, en UTC. El cliente lo muestra en su
            zona horaria.
          format: date-time
          type: string
      required:
        - active_users
        - messages_sent
        - servers_created
        - start
      type: object
    model.GlobalSummary:
      properties:
        active_users:
          description: ActiveUsers son los usuarios distintos con mensajes o cambios de
            membresía en el período.
          minimum: 0
          type: integer
        from:
          format: date-time
          type: string
        granularity:
          description: Granularity es hour si el período dura hasta 24 horas y day si es
            más largo.
          enum:
            - hour
            - day
          type: string
        has_activity:
          description: HasActivity es false cuando todos los contadores del período son
            cero.
          type: boolean
        messages_sent:
          minimum: 0
          type: integer
        series:
          items:
            $ref: "#/components/schemas/model.GlobalPoint"
          type: array
        servers_created:
          description: ServersCreated son los servidores cuyo primer evento server_updated
            ocurrió en el período.
          minimum: 0
          type: integer
        to:
          format: date-time
          type: string
      required:
        - active_users
        - from
        - granularity
        - has_activity
        - messages_sent
        - series
        - servers_created
        - to
      type: object
    model.GrowthPoint:
      properties:
        members:
          minimum: 0
          type: integer
        start:
          description: Start es el inicio del tramo, en UTC. El cliente lo muestra en su
            zona horaria.
          format: date-time
          type: string
      required:
        - members
        - start
      type: object
    model.GrowthResponse:
      properties:
        from:
          format: date-time
          type: string
        has_activity:
          type: boolean
        points:
          items:
            $ref: "#/components/schemas/model.GrowthPoint"
          type: array
        to:
          format: date-time
          type: string
      required:
        - from
        - has_activity
        - points
        - to
      type: object
    model.Incident:
      properties:
        affected_services:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        created_by:
          description: |-
            CreatedBy y ResolvedBy son ids de staff. Faltan en los incidentes
            anteriores a guardar este dato y nunca salen en GET /v1/status.
          format: uuid
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        platform_status:
          enum:
            - operational
            - degraded
            - maintenance
          type: string
        resolved_at:
          format: date-time
          type: string
        resolved_by:
          format: uuid
          type: string
        status:
          enum:
            - active
            - resolved
          type: string
        title:
          type: string
      required:
        - affected_services
        - created_at
        - description
        - id
        - platform_status
        - status
        - title
      type: object
    model.IncidentInput:
      properties:
        affected_services:
          example:
            - metrics
            - gateway
          items:
            type: string
          type: array
        description:
          maxLength: 5000
          minLength: 1
          type: string
        platform_status:
          default: degraded
          description: PlatformStatus es degraded si no se envía.
          enum:
            - operational
            - degraded
            - maintenance
          type: string
        title:
          maxLength: 160
          minLength: 1
          type: string
      required:
        - description
        - title
      type: object
    model.IncidentPage:
      properties:
        incidents:
          items:
            $ref: "#/components/schemas/model.Incident"
          type: array
        total:
          type: integer
      required:
        - incidents
        - total
      type: object
    model.PlatformStatusResponse:
      properties:
        incidents:
          items:
            $ref: "#/components/schemas/model.Incident"
          type: array
        status:
          enum:
            - operational
            - degraded
            - maintenance
          type: string
      required:
        - incidents
        - status
      type: object
    model.ServerSummary:
      properties:
        active_members:
          description: ActiveMembers son los usuarios distintos con actividad registrada
            en el período.
          minimum: 0
          type: integer
        from:
          format: date-time
          type: string
        has_activity:
          description: HasActivity es false cuando todos los contadores del período son
            cero.
          type: boolean
        messages_sent:
          minimum: 0
          type: integer
        new_members:
          minimum: 0
          type: integer
        to:
          format: date-time
          type: string
      required:
        - active_members
        - from
        - has_activity
        - messages_sent
        - new_members
        - to
      type: object
    model.StatusResponse:
      properties:
        status:
          example: ready
          type: string
      required:
        - status
      type: object
